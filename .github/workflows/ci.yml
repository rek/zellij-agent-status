name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --lib --target x86_64-unknown-linux-gnu
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: zellij-agent-status.wasm
          path: target/wasm32-wasip1/release/zellij_agent_status.wasm
